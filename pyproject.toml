[project]
name = "booktracker"
version = "0.1.0"
description = "Трекер прочитаних книжок"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit", "mypy", "pydantic", "pydantic-settings"]

[project.scripts]
booktracker = "booktracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"


exclude = ["legacy/"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unused_ignores = true
