[project]
name = "booktracker"
version = "0.1.0"
description = "Трекер прочитаних книжок"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit", "mypy", "pydantic", "pydantic-settings", "import-linter"]

[project.scripts]
booktracker = "booktracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["legacy/"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unused_ignores = true

[tool.importlinter]
root_package = "booktracker"

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["booktracker.domain"]
forbidden_modules = ["booktracker.services", "booktracker.sources", "booktracker.cli"]

[[tool.importlinter.contracts]]
name = "Services do not know adapters"
type = "forbidden"
source_modules = ["booktracker.services"]
forbidden_modules = ["booktracker.sources", "booktracker.cli"]
